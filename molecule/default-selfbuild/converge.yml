---
- name: Include roles for SFTPGo Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for SFTPGo Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

    # verify.yml runs as a separate playbook, where the role's variables are no
    # longer in scope. Reading defaults/main.yml there works for leaf literals
    # but not for the values built out of them through Jinja, so hand those
    # over already resolved - by the role's own variable precedence, which is
    # exactly what the systemd unit was rendered from.
    - name: Record the values the role resolved, for verify.yml
      ansible.builtin.copy:
        content: "{{ sftpgo_molecule_resolved | to_nice_json }}"
        dest: /root/sftpgo-molecule-resolved.json
        mode: "0600"
      vars:
        sftpgo_molecule_resolved:
          identifier: "{{ sftpgo_identifier }}"
          container_image: "{{ sftpgo_container_image }}"
          data_path: "{{ sftpgo_data_path }}"
          home_path: "{{ sftpgo_home_path }}"
          base_path: "{{ sftpgo_base_path }}"
          self_build_image: "{{ sftpgo_container_image_self_build_name }}"
          self_build_src_path: "{{ sftpgo_container_image_self_build_src_files_path }}"

- name: Ensure SFTPGo service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure SFTPGo systemd service is started
      ansible.builtin.systemd_service:
        name: sftpgo.service
        state: started
