---
- name: Verify SFTPGo backed by Postgres
  hosts: all
  become: true
  gather_facts: false

  vars:
    sftpgo_verify_base_url: "http://localhost:{{ sftpgo_container_http_port }}"
    sftpgo_verify_metrics_url: "http://localhost:{{ sftpgo_environment_variables_telemetry_bind_port }}"
    sftpgo_verify_username: molecule-postgres-user
    # Uploaded over SFTP and read back both over SFTP and off the host
    # filesystem, so it has to survive the whole round trip unchanged.
    sftpgo_verify_payload: molecule-sftpgo-postgres-payload-42
    sftpgo_verify_remote_name: landed-via-sftp.txt
    sftpgo_verify_key_path: /root/sftpgo-molecule-key
    sftpgo_verify_wrong_key_path: /root/sftpgo-molecule-wrong-key

  tasks:
    - name: Verify that SFTPGo works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: sftpgo_defaults

        - name: Wait for the SFTPGo systemd service to become active (up to 180s)
          ansible.builtin.systemd_service:
            name: sftpgo.service
          register: sftpgo_service
          until: sftpgo_service.status.ActiveState == 'active'
          retries: 36
          delay: 5
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the SFTPGo systemd service is active
          ansible.builtin.assert:
            that: sftpgo_service.status.ActiveState == 'active'
            fail_msg: "sftpgo.service is not active ({{ sftpgo_service.status.ActiveState }})"
            success_msg: "sftpgo.service is active"

        - name: Retrieve the SFTPGo systemd service log for debugging
          when: sftpgo_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=sftpgo.service
          changed_when: false

        - name: Read the values the role resolved
          ansible.builtin.slurp:
            src: /root/sftpgo-molecule-resolved.json
          register: sftpgo_resolved_raw

        - name: Remember the values the role resolved
          ansible.builtin.set_fact:
            sftpgo_resolved: "{{ sftpgo_resolved_raw.content | b64decode | from_json }}"

        # The connection string is what the role builds out of the Postgres
        # variables, and getting it wrong is the failure mode this scenario exists
        # for. Postgres' socket form is peculiar - the host is `localhost` and the
        # socket directory arrives as a query parameter - which is exactly why it
        # is worth pinning down.
        - name: Assert the role built a Unix-socket Postgres connection string
          ansible.builtin.assert:
            that:
              - sftpgo_resolved.database_connection_string.startswith('postgres://' + sftpgo_database_postgres_username + ':' + sftpgo_database_postgres_password + '@localhost/')
              - sftpgo_resolved.database_connection_string.endswith('/' + sftpgo_database_name + '?host=' + sftpgo_resolved.database_socket_path_container)
            fail_msg: "The role built an unexpected Postgres connection string: {{ sftpgo_resolved.database_connection_string }}"
            success_msg: "The role points SFTPGo at {{ sftpgo_database_name }} over the Postgres Unix socket"

        # `/healthz` answers 200 unconditionally, including on a completely
        # unconfigured SFTPGo, so it is good for nothing but waiting for the HTTP
        # listener to come up. It is never asserted on.
        - name: Wait for SFTPGo to start listening (up to 5m)
          ansible.builtin.uri:
            url: "{{ sftpgo_verify_base_url }}/healthz"
            method: GET
            status_code: [200]
            follow_redirects: none
          register: sftpgo_healthz
          until: sftpgo_healthz.status == 200
          retries: 60
          delay: 5

        - name: Ask SFTPGo for its web interfaces and its REST API without a token
          ansible.builtin.uri:
            url: "{{ sftpgo_verify_base_url }}{{ item.path }}"
            method: GET
            # Deliberately permissive: every status below is compared in the
            # assert that follows, so that a wrong answer fails there - where the
            # message says what was expected - rather than inside this fetch.
            status_code: [200, 302, 401, 403, 404, 500]
            follow_redirects: none
          register: sftpgo_unauthenticated
          changed_when: false
          loop:
            - {path: /web/client/login, status: 200}
            - {path: /web/admin/login, status: 404}
            - {path: /web/admin/setup, status: 404}
            - {path: /api/v2/version, status: 401}
            - {path: /api/v2/status, status: 401}
            - {path: /api/v2/users, status: 401}

        # `/web/admin/setup` is SFTPGo's first-admin wizard, which hands full
        # administrative rights to whoever reaches it first. With the web admin
        # switched off it is not routed at all, and `/web/admin/login` is gone with
        # it, while the web client the scenario asked for is served. Only the `env`
        # file this role renders can produce that combination - left to itself the
        # image serves both interfaces.
        - name: Assert SFTPGo serves only the web client and no unauthenticated API
          ansible.builtin.assert:
            that:
              - sftpgo_unauthenticated.results[0].status == 200
              - sftpgo_unauthenticated.results[1].status == 404
              - sftpgo_unauthenticated.results[2].status == 404
              - sftpgo_unauthenticated.results[3].status == 401
              - sftpgo_unauthenticated.results[4].status == 401
              - sftpgo_unauthenticated.results[5].status == 401
            fail_msg: >-
              SFTPGo answered unexpectedly without a token:
              {{ sftpgo_unauthenticated.results | map(attribute='status') | list }}
            success_msg: "SFTPGo serves the web client only, with no administrative interface and no unauthenticated REST API"

        - name: Obtain an SFTPGo REST API token as the admin the role created
          ansible.builtin.uri:
            url: "{{ sftpgo_verify_base_url }}/api/v2/token"
            method: GET
            url_username: "{{ sftpgo_environment_variables_sftpgo_default_admin_username }}"
            url_password: "{{ sftpgo_environment_variables_sftpgo_default_admin_password }}"
            force_basic_auth: true
            status_code: [200]
            follow_redirects: none
          register: sftpgo_token

        - name: Assert the admin the role bootstrapped can authenticate
          ansible.builtin.assert:
            that: sftpgo_token.json.access_token | default('') | length > 0
            fail_msg: "SFTPGo issued no token for {{ sftpgo_environment_variables_sftpgo_default_admin_username }}"
            success_msg: "SFTPGo issued a token for the admin the role bootstrapped"

        - name: Query the version of the running SFTPGo
          ansible.builtin.uri:
            url: "{{ sftpgo_verify_base_url }}/api/v2/version"
            method: GET
            headers:
              Authorization: "Bearer {{ sftpgo_token.json.access_token }}"
            status_code: [200]
            follow_redirects: none
          register: sftpgo_version_reported

        - name: Assert the running SFTPGo is the version this role installs
          ansible.builtin.assert:
            that: sftpgo_version_reported.json.version == sftpgo_defaults.sftpgo_version | regex_replace('^v', '')
            fail_msg: "SFTPGo reports {{ sftpgo_version_reported.json.version | default('none') }}, expected {{ sftpgo_defaults.sftpgo_version }}"
            success_msg: "SFTPGo reports {{ sftpgo_version_reported.json.version }}"

        - name: Determine which container image SFTPGo runs
          ansible.builtin.command:
            cmd: docker inspect --format {{ '{{.Config.Image}}' }} {{ sftpgo_resolved.identifier }}
          register: sftpgo_container_image_in_use
          changed_when: false

        - name: Assert SFTPGo runs the image the role configures
          ansible.builtin.assert:
            that:
              - sftpgo_container_image_in_use.stdout == sftpgo_resolved.container_image
              - sftpgo_container_image_in_use.stdout.split(':') | last == sftpgo_defaults.sftpgo_version
            fail_msg: >-
              SFTPGo runs {{ sftpgo_container_image_in_use.stdout }},
              but the role configures {{ sftpgo_resolved.container_image }}
              at version {{ sftpgo_defaults.sftpgo_version }}
            success_msg: "SFTPGo runs {{ sftpgo_container_image_in_use.stdout }}"

        - name: Ask SFTPGo about the services it started
          ansible.builtin.uri:
            url: "{{ sftpgo_verify_base_url }}/api/v2/status"
            method: GET
            headers:
              Authorization: "Bearer {{ sftpgo_token.json.access_token }}"
            status_code: [200]
            follow_redirects: none
          register: sftpgo_status

        # `/api/v2/status` reports what SFTPGo's configuration layer resolved, so
        # it sees the `env` file this role rendered rather than the template on
        # disk. SFTPGo falls back to SQLite when nothing selects a data provider
        # and to port 2022 for SFTP, so none of this can be satisfied by an
        # instance the role never configured.
        - name: Assert SFTPGo resolved the configuration the role rendered
          ansible.builtin.assert:
            that:
              - sftpgo_status.json.data_provider.driver == 'postgresql'
              - sftpgo_status.json.data_provider.is_active
              - sftpgo_status.json.ssh.bindings[0].port == sftpgo_container_sftp_port
              - not sftpgo_status.json.webdav.is_active
            fail_msg: "SFTPGo did not resolve the configuration the role rendered: {{ sftpgo_status.json }}"
            success_msg: >-
              SFTPGo serves SFTP on port {{ sftpgo_container_sftp_port }} against the
              {{ sftpgo_status.json.data_provider.driver }} data provider, with WebDAV off

        - name: Generate SSH key pairs for the SFTPGo probe user
          ansible.builtin.command:
            cmd: ssh-keygen -q -t ed25519 -N '' -C molecule -f {{ item }}
            creates: "{{ item }}"
          loop:
            - "{{ sftpgo_verify_key_path }}"
            - "{{ sftpgo_verify_wrong_key_path }}"

        - name: Read the SFTPGo probe user's public key
          ansible.builtin.slurp:
            src: "{{ sftpgo_verify_key_path }}.pub"
          register: sftpgo_public_key

        - name: Create an SFTPGo user through the admin REST API
          ansible.builtin.uri:
            url: "{{ sftpgo_verify_base_url }}/api/v2/users"
            method: POST
            headers:
              Authorization: "Bearer {{ sftpgo_token.json.access_token }}"
            body_format: json
            body:
              username: "{{ sftpgo_verify_username }}"
              status: 1
              permissions:
                "/": ["*"]
              home_dir: "/srv/sftpgo/data/{{ sftpgo_verify_username }}"
              public_keys:
                - "{{ sftpgo_public_key.content | b64decode | trim }}"
            status_code: [201]
            follow_redirects: none
          register: sftpgo_user_creation

        - name: Write the file that will be uploaded to SFTPGo
          ansible.builtin.copy:
            content: "{{ sftpgo_verify_payload }}"
            dest: /root/sftpgo-molecule-upload.txt
            mode: "0600"

        - name: Write the SFTP batch that uploads it and reads it back
          ansible.builtin.copy:
            content: |
              put /root/sftpgo-molecule-upload.txt {{ sftpgo_verify_remote_name }}
              get {{ sftpgo_verify_remote_name }} /root/sftpgo-molecule-download.txt
              bye
            dest: /root/sftpgo-molecule-batch
            mode: "0600"

        # The probe that crosses every boundary at once: a real SSH transport, a
        # real SFTP subsystem, a user record that only exists because it was
        # written to Postgres, key material only that user has, and a write that
        # has to end up inside the bind mount the role set up.
        - name: Upload a file to SFTPGo over SFTP and read it back
          ansible.builtin.command:
            cmd: >-
              sftp -q
              -i {{ sftpgo_verify_key_path }}
              -o StrictHostKeyChecking=no
              -o UserKnownHostsFile=/dev/null
              -o IdentitiesOnly=yes
              -o BatchMode=yes
              -o ConnectTimeout=15
              -P {{ sftpgo_container_sftp_port }}
              -b /root/sftpgo-molecule-batch
              {{ sftpgo_verify_username }}@127.0.0.1
          register: sftpgo_sftp_session
          changed_when: true

        - name: Read back what SFTPGo returned over SFTP
          ansible.builtin.slurp:
            src: /root/sftpgo-molecule-download.txt
          register: sftpgo_downloaded

        - name: Read the uploaded file off the host
          ansible.builtin.slurp:
            src: "{{ sftpgo_resolved.data_path }}/{{ sftpgo_verify_username }}/{{ sftpgo_verify_remote_name }}"
          register: sftpgo_uploaded_on_host

        - name: Assert the SFTP round trip landed in the role's data path
          ansible.builtin.assert:
            that:
              - sftpgo_downloaded.content | b64decode == sftpgo_verify_payload
              - sftpgo_uploaded_on_host.content | b64decode == sftpgo_verify_payload
            fail_msg: >-
              The SFTP round trip did not preserve the payload
              ({{ sftpgo_resolved.data_path }}/{{ sftpgo_verify_username }}/{{ sftpgo_verify_remote_name }})
            success_msg: >-
              A file uploaded over SFTP is stored under
              {{ sftpgo_resolved.data_path }}/{{ sftpgo_verify_username }} and reads back intact

        # Without this, "SFTP works" could just mean "the SSH listener lets
        # everyone in". The username is the real one this time, so SFTPGo has to
        # look its public keys up in Postgres and refuse a key that is not among
        # them.
        - name: Attempt an SFTP session as the real user with a key it does not have
          ansible.builtin.command:
            cmd: >-
              sftp -q
              -i {{ sftpgo_verify_wrong_key_path }}
              -o StrictHostKeyChecking=no
              -o UserKnownHostsFile=/dev/null
              -o IdentitiesOnly=yes
              -o BatchMode=yes
              -o ConnectTimeout=15
              -o NumberOfPasswordPrompts=0
              -P {{ sftpgo_container_sftp_port }}
              -b /root/sftpgo-molecule-batch
              {{ sftpgo_verify_username }}@127.0.0.1
          register: sftpgo_sftp_rejected
          changed_when: false
          failed_when: sftpgo_sftp_rejected.rc == 0

        - name: Assert SFTPGo checks the key against the one stored for the user
          ansible.builtin.assert:
            that: sftpgo_sftp_rejected.rc != 0
            fail_msg: "SFTPGo accepted an SFTP session authenticated with a key the user does not have"
            success_msg: "SFTPGo rejects an SFTP session authenticated with a key the user does not have"

        # SFTPGo's telemetry server does not start at all unless it is given a bind
        # port, so an instance the role never configured has nothing listening
        # here. `sftpgo_metrics_enabled` is what the MASH playbook turns on
        # whenever Prometheus is deployed alongside. Fetched last, so that the
        # counters have the probes above to report on.
        #
        # `sftpgo_dataprovider_availability` is a gauge a background goroutine
        # refreshes once a minute by actually querying the provider, and it reads 0
        # until that first check lands - so this waits for the check rather than
        # asserting on a value that means "not measured yet".
        - name: Retrieve SFTPGo's Prometheus metrics once the data provider has been checked (up to 2m)
          ansible.builtin.uri:
            url: "{{ sftpgo_verify_metrics_url }}/metrics"
            method: GET
            status_code: [200]
            return_content: true
            follow_redirects: none
          register: sftpgo_metrics
          until: sftpgo_metrics.content | regex_search('^sftpgo_dataprovider_availability 1$', multiline=True) is not none
          retries: 24
          delay: 5

        - name: Remember the unlabelled counters SFTPGo reports
          ansible.builtin.set_fact:
            sftpgo_metric_values: >-
              {{
                dict(
                  sftpgo_metrics.content.splitlines()
                  | select('match', '^sftpgo_[a-z_0-9]+ ')
                  | map('split', ' ')
                )
              }}

        # Not just "the endpoint answers": these counters are a second, independent
        # account of everything the probes above did. `dataprovider_availability`
        # is SFTPGo's own verdict on whether Postgres is reachable, and the login
        # and transfer counters can only be non-zero because the SFTP round trip
        # and the rejected key actually happened.
        - name: Assert SFTPGo's metrics report the data provider and the transfers the probes made
          ansible.builtin.assert:
            that:
              - sftpgo_metric_values['sftpgo_dataprovider_availability'] | float == 1
              - sftpgo_metric_values['sftpgo_public_key_login_ok_total'] | float >= 1
              - sftpgo_metric_values['sftpgo_public_key_login_ko_total'] | float >= 1
              - sftpgo_metric_values['sftpgo_uploads_total'] | float >= 1
              - sftpgo_metric_values['sftpgo_downloads_total'] | float >= 1
            fail_msg: >-
              SFTPGo's metrics on port {{ sftpgo_environment_variables_telemetry_bind_port }}
              do not report what the probes did: {{ sftpgo_metric_values | default({}) }}
            success_msg: >-
              SFTPGo reports its Postgres provider available and accounts for the SFTP
              round trip and the rejected key on port {{ sftpgo_environment_variables_telemetry_bind_port }}

        - name: Read the SFTPGo records back out of Postgres
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - --env
              - "PGPASSWORD={{ sftpgo_database_postgres_password }}"
              - "{{ postgres_identifier }}"
              - psql
              - "--username={{ sftpgo_database_postgres_username }}"
              - "--dbname={{ sftpgo_database_name }}"
              - --no-align
              - --tuples-only
              - --command
              - >-
                select 'admin', username from admins
                union all select 'user', username from users
                union all select 'schema', version::text from schema_version
                order by 1, 2
          register: sftpgo_postgres_query
          changed_when: false
          # A data provider SFTPGo never migrated has no tables to select from, so
          # this errors rather than returning nothing. Let the assert below be the
          # one that fails, since its message is the one that names the SQLite
          # fallback as the likely reason.
          failed_when: false

        - name: Check whether SFTPGo also left a SQLite data provider behind
          ansible.builtin.stat:
            path: "{{ sftpgo_resolved.home_path }}/sftpgo.db"
          register: sftpgo_sqlite_file

        # The claim this scenario exists to make, and the SQLite check is half of
        # it. SFTPGo silently falls back to a SQLite file in its home directory
        # when no data provider is configured, so "Postgres holds the records" is
        # only meaningful alongside "and there is no SQLite file to have held them
        # instead". A non-zero schema version means SFTPGo ran its migrations
        # against this database.
        - name: Assert Postgres is where SFTPGo's records live, with no SQLite fallback
          ansible.builtin.assert:
            that:
              - "'admin|' + sftpgo_environment_variables_sftpgo_default_admin_username in sftpgo_postgres_query.stdout"
              - "'user|' + sftpgo_verify_username in sftpgo_postgres_query.stdout"
              - sftpgo_postgres_query.stdout | regex_search('schema[|][1-9][0-9]*') is not none
              - not sftpgo_sqlite_file.stat.exists
            fail_msg: >-
              Postgres does not hold SFTPGo's records ({{ sftpgo_postgres_query.stdout | default('') }}),
              or SFTPGo fell back to SQLite at {{ sftpgo_resolved.home_path }}/sftpgo.db
            success_msg: >-
              Postgres holds admin {{ sftpgo_environment_variables_sftpgo_default_admin_username }}
              and user {{ sftpgo_verify_username }}, and no SQLite data provider was created

        - name: Show the SFTPGo verification summary
          ansible.builtin.debug:
            msg:
              - "SFTPGo systemd: {{ sftpgo_service.status.ActiveState }}"
              - "SFTPGo version: {{ sftpgo_version_reported.json.version }}"
              - "SFTPGo image: {{ sftpgo_container_image_in_use.stdout }}"
              - "SFTPGo data provider: {{ sftpgo_status.json.data_provider.driver }} in the {{ sftpgo_database_name }} Postgres database"
              - "SFTPGo metrics: data provider available={{ sftpgo_metric_values['sftpgo_dataprovider_availability'] }}, uploads={{ sftpgo_metric_values['sftpgo_uploads_total'] }} on port {{ sftpgo_environment_variables_telemetry_bind_port }}"
              - "SFTPGo SFTP round trip: {{ sftpgo_resolved.data_path }}/{{ sftpgo_verify_username }}/{{ sftpgo_verify_remote_name }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the SFTPGo systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=sftpgo.service
          register: sftpgo_service_log
          changed_when: false

        - name: Show the SFTPGo systemd service log
          ansible.builtin.debug:
            var: sftpgo_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "SFTPGo verification failed. The systemd service log is printed above."
