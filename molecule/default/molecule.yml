---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: sftpgo-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        sftpgo_debug_service_enabled: false
        sftpgo_restarts_check_enabled: true

        # Variables for SFTPGo
        sftpgo_uid: 1000
        sftpgo_gid: 1000
        sftpgo_scheme: http
        sftpgo_hostname: localhost
        sftpgo_container_labels_traefik_enabled: false

        # This scenario keeps the role's own HTTP surface: no web admin, no web
        # client, REST API only. That is what a MASH installation gets unless
        # the operator opts into the (proprietary-themed) web interfaces, and it
        # is what makes the negative controls in verify.yml meaningful - an
        # SFTPGo that never saw this role's `env` file answers `/` with a 302 to
        # its unauthenticated first-admin setup wizard, not with a 404.
        sftpgo_environment_variables_httpd_bindings_0_enable_web_admin: false
        sftpgo_environment_variables_httpd_bindings_0_enable_web_client: false

        sftpgo_environment_variables_data_provider_driver: sqlite

        # Ports deliberately unlike SFTPGo's own fallbacks (8080 for HTTP, 2022
        # for SFTP). The process can only be listening here if the `env` file
        # this role renders reached it, and they can only be reachable from the
        # test host if `docker create` published the same numbers.
        sftpgo_container_http_port: 8090
        sftpgo_container_http_host_bind_port: 8090
        sftpgo_container_sftp_port: 2090
        # Traefik terminates SFTP through a TCP router in a real deployment, so
        # the role only publishes the SFTP port when those labels are off.
        sftpgo_container_labels_traefik_sftp_enabled: false
        sftpgo_container_labels_traefik_webdav_enabled: false

        # The admin the REST API probes authenticate as. SFTPGo creates it on
        # first start and refuses to start when asked for it without
        # credentials, so this also exercises the declarative bootstrap path
        # the role documents.
        sftpgo_environment_variables_data_provider_create_default_admin: true
        sftpgo_environment_variables_sftpgo_default_admin_username: molecule-admin
        sftpgo_environment_variables_sftpgo_default_admin_password: molecule-admin-password-default
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
